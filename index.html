<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أسئلة درس قواعد البيانات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#14243b;--mut:#5b6b80;--line:#d5dde7;--pri:#0e7c86;--pri2:#d9f0f2;--ok:#1b8a4b;--okbg:#dcf5e6;--bad:#c23b3b;--badbg:#fbe1e1;--gold:#f2b134;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1824;--card:#182536;--ink:#e8eef6;--mut:#9fb0c4;--line:#2a3b50;--pri:#4fc3cc;--pri2:#173a40;--ok:#58d68d;--okbg:#17382a;--bad:#ff8a8a;--badbg:#3d1d1f}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,'Segoe UI',sans-serif;line-height:1.8}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{background:var(--ink);color:#fff;border-radius:14px;padding:18px 20px;margin-bottom:14px;border-bottom:5px solid var(--gold)}
header h1{margin:0;font-size:1.45rem;font-weight:800}
header p{margin:2px 0 0;color:#b9c7d8;font-size:.9rem}
nav{display:flex;gap:6px;margin-bottom:14px}
nav button{flex:1;font:inherit;font-weight:600;padding:9px 4px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;cursor:pointer}
nav button[aria-selected=true]{background:var(--pri);border-color:var(--pri);color:#fff}
button:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none;display:flex;gap:10px}
summary::-webkit-details-marker{display:none}
summary b{flex:none;background:var(--pri2);color:var(--pri);border-radius:8px;min-width:30px;text-align:center;height:30px;line-height:30px}
details[open] summary{border-bottom:1px dashed var(--line)}
.ans{padding:10px 16px 14px}
.ans h4{margin:8px 0 2px;color:var(--pri);font-size:.95rem}
.ans ul{margin:2px 0;padding-inline-start:20px}
.ans table{border-collapse:collapse;width:100%;font-size:.88rem;margin-top:6px}
.ans th,.ans td{border:1px solid var(--line);padding:4px 6px;text-align:center}
.ans th{background:var(--pri2)}
.wide{overflow-x:auto}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.bar{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin-bottom:8px}
.prog{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.q{font-size:1.15rem;font-weight:700;margin:0 0 12px}
.opt{display:block;width:100%;text-align:start;font:inherit;padding:10px 14px;margin-bottom:8px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.go{font:inherit;font-weight:700;background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 22px;cursor:pointer;margin-top:6px}
.big{font-size:2.6rem;font-weight:800;margin:0;text-align:center}
.center{text-align:center}
.m2{display:grid;grid-template-columns:1fr 1.6fr;gap:8px}
.m2 .opt{margin:0;font-size:.9rem;padding:8px 10px}
.m2 .opt.sel{border-color:var(--gold);background:var(--pri2)}
.m2 .opt:disabled{opacity:.9}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
@media(prefers-reduced-motion:reduce){.shake{animation:none}.prog i{transition:none}}
nav button{font-size:.85rem}header small{display:block;margin-top:6px;color:var(--gold)}
.sec{margin:16px 0 8px;font-size:1.05rem;color:var(--pri)}
.ex{margin:10px 0 0;padding:10px 12px;border-inline-start:4px solid var(--gold);background:var(--bg);border-radius:8px;font-size:.92rem}
.ex .tag{display:inline-block;background:var(--pri2);color:var(--pri);border-radius:6px;padding:0 8px;margin:2px}
.ex .w{color:var(--bad);font-weight:700;margin:4px 0}.ex .ok2{color:var(--ok);font-weight:700}.ex .r{margin-top:8px}
.ex input{font:inherit;padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.ex button{font:inherit;margin:3px;padding:3px 10px;border:1px solid var(--pri);background:var(--card);color:var(--pri);border-radius:8px;cursor:pointer}

/* Tech interface refresh */
:root{
  --bg:#07111f;--card:rgba(13,29,49,.92);--ink:#e7f7ff;--mut:#9bb7ca;
  --line:rgba(73,194,230,.24);--pri:#19c8e8;--pri2:rgba(25,200,232,.13);
  --ok:#42e6a4;--okbg:rgba(66,230,164,.12);--bad:#ff7188;--badbg:rgba(255,113,136,.13);
  --gold:#a5f3fc;
}
html{background:#07111f}
body{
  background:
    radial-gradient(ellipse at 12% 0%,rgba(0,194,255,.15),transparent 35%),
    radial-gradient(ellipse at 90% 20%,rgba(82,89,255,.13),transparent 32%),
    linear-gradient(rgba(29,91,123,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(29,91,123,.08) 1px,transparent 1px),
    #07111f;
  background-size:auto,auto,32px 32px,32px 32px,auto;
  color:var(--ink);font-family:'Cairo',Tahoma,'Segoe UI',sans-serif;
}
.wrap{max-width:1000px;padding:24px 18px 40px}
header{
  position:relative;overflow:hidden;
  background:linear-gradient(120deg,rgba(12,34,58,.97),rgba(10,24,46,.96));
  border:1px solid rgba(25,200,232,.38);border-bottom:3px solid var(--pri);
  border-radius:20px;padding:25px 26px;margin-bottom:18px;
  box-shadow:0 14px 45px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.04);
}
header:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:linear-gradient(var(--pri),#7c83ff)}
header:after{content:"";position:absolute;width:190px;height:190px;left:-55px;top:-90px;border:1px solid rgba(25,200,232,.2);border-radius:50%;box-shadow:0 0 0 20px rgba(25,200,232,.025),0 0 0 42px rgba(25,200,232,.02);pointer-events:none}
header h1{font-size:clamp(1.35rem,3vw,2rem);letter-spacing:.1px}
header p{color:#b5d4e6;margin-top:5px}
header small{color:#73eaff;font-size:.82rem}
nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:0 0 18px}
nav button{
  position:relative;border:1px solid var(--line);background:rgba(12,29,48,.88);
  color:#b9d4e5;border-radius:12px;padding:11px 8px;
  box-shadow:0 4px 14px rgba(0,0,0,.12);transition:transform .18s,border-color .18s,background .18s;
}
nav button:hover{transform:translateY(-2px);border-color:rgba(25,200,232,.65);color:#fff}
nav button[aria-selected=true]{
  background:linear-gradient(135deg,#087f9e,#1557a6);border-color:#38ddf6;color:white;
  box-shadow:0 0 22px rgba(25,200,232,.18),inset 0 1px 0 rgba(255,255,255,.13)
}
details,.panel{
  background:linear-gradient(145deg,rgba(15,34,56,.96),rgba(10,25,43,.96));
  border:1px solid var(--line);border-radius:14px;
  box-shadow:0 7px 22px rgba(0,0,0,.12);transition:border-color .2s,transform .2s;
}
details:hover{border-color:rgba(25,200,232,.45)}
summary{padding:14px 16px;color:#e5f7ff}
summary b{background:rgba(25,200,232,.14);color:#57e7ff;border:1px solid rgba(25,200,232,.22)}
details[open] summary{border-bottom:1px dashed rgba(73,194,230,.28)}
.ans{color:#d0e4f0;padding:12px 18px 16px}
.ans h4,.sec{color:#59e4fa}
.ans th{background:rgba(25,200,232,.13);color:#e5fbff}
.ans td,.ans th{border-color:var(--line)}
.ex{background:rgba(4,15,29,.72);border-inline-start-color:#4ee7ff;color:#cce4f1}
.ex .tag{background:rgba(25,200,232,.13);color:#70eaff}
.opt{
  background:rgba(5,18,33,.78);border-color:rgba(73,194,230,.24);color:#d9edf8;
  border-radius:12px;transition:border-color .15s,background .15s,transform .15s;
}
.opt:hover:not(:disabled){border-color:#31d7f5;background:rgba(25,200,232,.09);transform:translateX(-2px)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:#7ef3bd}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:#ff9eaf}
.go{background:linear-gradient(135deg,#0ca9c7,#2466d8);box-shadow:0 5px 18px rgba(13,169,199,.2)}
.go:hover{filter:brightness(1.12)}
.prog{background:rgba(73,194,230,.15)}
.prog i{background:linear-gradient(90deg,#20d9ed,#7c83ff)}
.big{color:#6cecff}
input{border-color:var(--line)!important}
button:focus-visible,summary:focus-visible{outline:3px solid #72efff;outline-offset:3px}
::selection{background:rgba(25,200,232,.3);color:white}
@media(max-width:620px){
  .wrap{padding:14px 11px 28px}
  header{padding:20px 18px}
  nav{grid-template-columns:repeat(2,minmax(0,1fr))}
  nav button{font-size:.88rem;padding:10px 6px}
  .panel{padding:14px}
  .m2{grid-template-columns:1fr 1.25fr}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}


/* Light futuristic interface: bright, clean, technology-inspired */

  --bg:#f3f8fc;--card:#ffffff;--ink:#18324a;--mut:#60788d;--line:#d7e5ef;
  --pri:#087ea4;--pri2:#e1f5fb;--ok:#14804a;--okbg:#e1f8eb;
  --bad:#c52f50;--badbg:#fff0f3;--gold:#e4a11b;
}
html{background:#f3f8fc}
body{
  background:
    radial-gradient(ellipse at 8% 0%,rgba(31,190,226,.16),transparent 34%),
    radial-gradient(ellipse at 92% 12%,rgba(82,130,255,.11),transparent 32%),

header{

}
header:before{background:linear-gradient(#18bdd7,#6385f5)}
header:after{border-color:rgba(8,126,164,.13);box-shadow:0 0 0 20px rgba(8,126,164,.025),0 0 0 42px rgba(8,126,164,.018)}
header p{color:#60788d}
header small{color:#087ea4}
nav button{
  background:rgba(255,255,255,.92);color:#35536b;border-color:#d4e5ef;

}

details:hover{border-color:#8ed8e8}
summary{color:#18324a}

details[open] summary{border-bottom-color:#d6e6ef}
.ans{color:#314d63}
.ans h4,.sec{color:#087ea4}
.ans th{background:#e4f6fb;color:#183d53}
.ans td,.ans th{border-color:#d7e5ef}

/* Interactive computer (question 1) */
.pc{max-width:520px;margin:6px auto 0;text-align:center}
.pc .mon{background:#1c2f43;border-radius:14px;padding:10px;box-shadow:0 8px 22px rgba(20,50,80,.25)}
.pc .scr{position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:linear-gradient(135deg,#0b2236,#123c5a);transition:box-shadow .25s}
.pc .scr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8fd8ea;font-weight:700;border:2px dashed rgba(143,216,234,.45);margin:8px;border-radius:6px}
.pc .ph[hidden],.pc .ov[hidden],.pc img[hidden]{display:none}
.pc .ov{position:absolute;inset:auto 8px 8px 8px;background:rgba(255,255,255,.94);color:#18324a;border-radius:10px;padding:8px 10px;font-size:.85rem;max-height:80%;overflow:auto}
.pc .ov table{border-collapse:collapse;margin:0 auto}
.pc .ov td,.pc .ov table{font-size:.72rem}
.pc .ov th{border:1px solid #b9d3e0;padding:1px 8px}
.pc .ov th{background:#e1f5fb}
.pc .neck{width:34px;height:14px;background:#2a4259;margin:0 auto}
.pc .base{width:120px;height:8px;background:#2a4259;border-radius:6px;margin:0 auto 8px}
.pc .row{display:flex;gap:8px;justify-content:center;margin-bottom:8px}
.pc .kb,.pc .tw{flex:1;max-width:240px;padding:6px 8px;border:2px solid var(--line);border-radius:10px;background:var(--card);font-size:.82rem;font-weight:600;transition:box-shadow .25s,border-color .25s}
.pc .hl{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold),0 0 18px rgba(228,161,27,.55)}
.pc .scr.hl{box-shadow:0 0 0 3px var(--gold),0 0 18px rgba(228,161,27,.55)}
.pc .up{display:inline-block;margin:2px 0 6px;padding:3px 12px;border:1px dashed var(--pri);color:var(--pri);border-radius:8px;cursor:pointer;font-size:.85rem}
.pc .bt{display:flex;flex-wrap:wrap;justify-content:center}
.pc .r{margin-top:8px;text-align:start}
.pc .ov.mid{inset:50% auto auto 50%;transform:translate(-50%,-50%);width:max-content;max-width:92%;text-align:center}
.pc .ov .gb{font:inherit;padding:2px 12px;border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:8px;cursor:pointer}
.pc .ov .w{color:#c52f50;font-weight:700}
@media(prefers-reduced-motion:reduce){.pc *{transition:none!important}}

</style>
</head>
<body>
<div class="wrap">
<header><h1>أسئلة الدرس: قواعد البيانات</h1><p>ادرس الأسئلة والأجوبة مع أمثلة حية</p><small>إعداد: أنس نهاد محمود الجعل — بإشراف الأستاذ الفاضل: سالم إبراهيم سالم حروب</small></header>
<main id="app"></main>
</div>
<script>
const $=s=>document.querySelector(s);
const L=a=>'<ul>'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
const S=[
["ما المقصود بالمفاهيم الآتية: قاعدة البيانات، إدارة قواعد البيانات، نظم قواعد البيانات، الكيان، النموذج العلائقي؟",
L(["<b>قاعدة البيانات:</b> مجموعة من البيانات المترابطة والمنظمة، تُخزَّن بطريقة تسهل الوصول إليها واسترجاعها.","<b>إدارة قواعد البيانات:</b> تنظيم البيانات وتخزينها واسترجاعها وتحديثها باستخدام نظام مخصص لذلك.","<b>نظم قواعد البيانات:</b> مجموعة البرامج والأدوات التي تُستخدم لإنشاء قواعد البيانات وإدارتها والتعامل معها.","<b>الكيان:</b> شيء له وجود مستقل ونريد تخزين بيانات عنه، مثل الطالب أو المعلم.","<b>النموذج العلائقي:</b> نموذج لتنظيم البيانات في جداول تتكون من صفوف وأعمدة."])],
["عدّد مكونات نظم إدارة قواعد البيانات مع إعطاء مثال لكل منها.",
L(["<b>الأجهزة:</b> مثل الحاسوب والخادم.","<b>البرمجيات:</b> مثل برنامج MySQL.","<b>البيانات:</b> مثل بيانات الطلاب ودرجاتهم.","<b>المستخدمون:</b> مثل مدير قاعدة البيانات والموظف.","<b>الإجراءات:</b> مثل خطوات إدخال البيانات وتحديثها وحمايتها."])],
["اذكر اثنين من أساليب الحماية في قاعدة البيانات، مع التوضيح.",
L(["<b>كلمات المرور:</b> تمنع الأشخاص غير المصرح لهم من الوصول إلى قاعدة البيانات.","<b>النسخ الاحتياطي:</b> يساعد على استعادة البيانات عند فقدانها أو تلفها."])],
["ما الفرق بين تكرار البيانات وتناسق البيانات؟",
L(["<b>تكرار البيانات:</b> وجود البيانات نفسها في أكثر من مكان داخل قاعدة البيانات.","<b>تناسق البيانات:</b> تطابق البيانات وعدم وجود تعارض بينها في مختلف أجزاء قاعدة البيانات."])],
["اشرح مستويات عمارة نظم إدارة قاعدة البيانات.",
L(["<b>المستوى الخارجي:</b> يوضح البيانات التي يحتاج إليها كل مستخدم.","<b>المستوى المفاهيمي:</b> يوضح البناء العام لقاعدة البيانات والعلاقات بين بياناتها.","<b>المستوى الداخلي:</b> يوضح كيفية تخزين البيانات فعلياً داخل الحاسوب."])],
["وضّح آلية استرجاع سجل من قاعدة البيانات، ممثلاً ذلك بمثال واقعي بمدرستك.",
"<p>يتم استرجاع السجل من خلال البحث عن قيمة محددة في أحد حقوله، ثم عرض السجل الذي يطابقها.</p><p><b>مثال:</b> البحث عن طالب باستخدام رقمه المدرسي، فتظهر بياناته مثل اسمه ووصفه ودرجاته.</p>"],
["حدد ثلاثة من الكيانات مع الصفات المناسبة لكل منها لنظام مدرستك.",
L(["<b>الطالب:</b> رقم الطالب، الاسم، الصف، تاريخ الميلاد.","<b>المعلم:</b> رقم المعلم، الاسم، التخصص، رقم الهاتف.","<b>المادة الدراسية:</b> رقم المادة، اسم المادة، عدد الحصص."])],
["مستعيناً بالشكل المجاور (مستشفى ← دواء: رقم الدواء، الشركة المصنعة، تاريخ الصنع، نوع العبوة، الاسم التجاري، الاسم العلمي) أجب عن الأسئلة (أ - هـ).",
"<h4>أ - اسم النظام (قاعدة البيانات)</h4>قاعدة بيانات المستشفى.<h4>ب - اسم الكيان (الجدول)</h4>الدواء.<h4>ج - أسماء الصفات (الحقول)</h4>"+L(["رقم الدواء","الاسم التجاري","الاسم العلمي","الشركة المصنعة","تاريخ الصنع","نوع العبوة"])+"<h4>د - مجال القيم الممكنة لكل حقل</h4>"+L(["<b>رقم الدواء:</b> أرقام صحيحة مثل 1001.","<b>الاسم التجاري:</b> الأسماء التجارية للأدوية.","<b>الاسم العلمي:</b> الأسماء العلمية للأدوية.","<b>الشركة المصنعة:</b> أسماء الشركات المنتجة للأدوية.","<b>تاريخ الصنع:</b> تاريخ محدد.","<b>نوع العبوة:</b> علبة أو زجاجة أو شريط."])+"<h4>هـ - الجدول المناسب (بيانات افتراضية)</h4><div class='wide'><table><tr><th>رقم الدواء</th><th>الاسم التجاري</th><th>الاسم العلمي</th><th>الشركة المصنعة</th><th>تاريخ الصنع</th><th>نوع العبوة</th></tr><tr><td>1001</td><td>بنادول</td><td>Paracetamol</td><td>شركة الأمل</td><td>2026/03/10</td><td>شريط</td></tr><tr><td>1002</td><td>أموكسيل</td><td>Amoxicillin</td><td>شركة الشفاء</td><td>2026/05/22</td><td>علبة</td></tr><tr><td>1003</td><td>زيرتك</td><td>Cetirizine</td><td>شركة النور</td><td>2026/07/01</td><td>زجاجة</td></tr></table></div>"],
["علّل ما يأتي: (أ) تتماثل البيانات المخزنة في الحقل وتختلف في السجل. (ب) يفضل استخدام الملفات المحوسبة بدل الملفات اليدوية في محل تجاري.",
"<h4>أ</h4>لأن الحقل يحتوي على بيانات من النوع نفسه، بينما يتكون السجل من مجموعة حقول مختلفة تصف كياناً واحداً.<h4>ب</h4>لسهولة تخزين البيانات والبحث عنها وتحديثها، وسرعة استرجاعها وتقليل الأخطاء، وتوفير الوقت والجهد."],
["دراسة حالة: لدى محمد شركة مقاولات عامة تعمل داخل الأراضي الفلسطينية ولها أفرع موزعة على مدن الضفة الغربية، وتعتمد النظام التقليدي لتخزين ملفاتها، وهو يريد تحويله إلى قاعدة بيانات لكنه غير مقتنع بهذا النظام.",
"<h4>أ - كيف تقنع محمداً بأن النظام الجديد أفضل من حيث الترتيب والدقة؟</h4>بأن نظام قاعدة البيانات ينظم البيانات في جداول مترابطة، ويسهل البحث والتعديل والاسترجاع، ويقلل تكرار البيانات والأخطاء، ويحافظ على دقتها.<h4>ب - ما الوظائف التي سيقوم بها النظام الجديد؟</h4>إدخال البيانات وتخزينها وتنظيمها، والبحث عنها واسترجاعها وتحديثها وحذفها عند الحاجة، وإعداد التقارير، وحماية البيانات وعمل نسخ احتياطية.<h4>ج - ما المكونات المادية والبرمجية التي ستوفرها؟</h4>"+L(["<b>المادية:</b> أجهزة الحاسوب، والخادم عند الحاجة، وأجهزة التخزين لحفظ البيانات ومعالجتها.","<b>البرمجية:</b> نظام تشغيل وبرنامج لإدارة قواعد البيانات مثل MySQL لإنشاء قاعدة البيانات وإدارتها وتحديث بياناتها."])+"<b>لماذا؟</b> لأن بيانات الشركة وأفرعها كثيرة وتحتاج إلى أجهزة تحفظها وتعالجها، وإلى برنامج ينظمها ويحميها ويسهّل الوصول إليها من الأفرع."+"<h4>د - ما نموذج قواعد البيانات الذي سيعتمده؟ ولماذا؟</h4>النموذج العلائقي، لأنه ينظم البيانات في جداول مترابطة، ويسهل البحث والتعديل، ويقلل تكرار البيانات، ويناسب تنظيم بيانات الشركة وفروعها وموظفيها ومبيعاتها."]
];
